<style>
/* Layout: telefon öncelikli; üstte tam genişlik renkli başlık (selam, kur, alacak); iş kartları renkli dosya sekmesi gibi; altta 4 sekmeli gezinme */
:root{
  --bg:#f2f5f3; --card:#ffffff; --ink:#1a2233; --muted:#5b6578; --line:#dbe2ee; --soft:#eef2f8;

  --devam:#1864ab;   --devam-s:#d9ecfc;   --devam-b:#1c7ed6;
  --revizyon:#c2410c; --revizyon-s:#ffe6d5; --revizyon-b:#e8590c;
  --teslim:#237a3c;  --teslim-s:#d3f2dc;  --teslim-b:#2b9a4a;
  --iptal:#555d66;   --iptal-s:#e4e7eb;   --iptal-b:#6c757d;
  --gec:#c92a2a; --gec-s:#ffe0e0; --gec-b:#e03131;
  --yakin:#b35c00; --yakin-s:#ffe8c2; --yakin-b:#e67700;

  --usd:#2b7a2f; --usd-s:#dff3dc;

  --r:18px; --shadow:0 1px 2px rgba(20,40,80,.06),0 6px 18px rgba(20,40,80,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141c; --card:#1b2029; --ink:#eef2f8; --muted:#a4adbd; --line:#2b3242; --soft:#232a36;
  --accent:#4fd39a; --accent2:#4fd39a; --accent-soft:#143a2b; --accent-ink:#ffffff;
  --gorusme:#b9a3ff; --gorusme-s:#2b2350; --gorusme-b:#7351ec;
  --devam:#7cc0ff; --devam-s:#142f4d; --devam-b:#2580dc;
  --revizyon:#ffa76a; --revizyon-s:#43230f; --revizyon-b:#e0611a;
  --teslim:#6fdc92; --teslim-s:#123522; --teslim-b:#2c9a4d;
