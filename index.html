  --makale:#ff8cc6; --makale-s:#42162e; --makale-b:#c2307f;
  --teslim:#6fdc92; --teslim-s:#123522; --teslim-b:#2c9a4d;
  --iptal:#a9b1bc; --iptal-s:#272d36; --iptal-b:#5d656f;
  --gec:#ff8a8a; --gec-s:#451a1d; --gec-b:#dc3a3a;
  --yakin:#ffbe5c; --yakin-s:#422b0a; --yakin-b:#d97400;
  --para:#55e0b3; --para-s:#0f3a2e; --para-b:#0c9a70; --usd:#8fe08f; --usd-s:#173418;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
h1,h2,h3,.num{font-family:var(--f-head);font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}

/* üst renkli başlık */
.hero{margin-inline:-16px;padding:18px 18px 24px;background:linear-gradient(140deg,var(--accent) 0%,#2d6fe0 45%,var(--accent2) 100%);color:var(--on);border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hero .sat{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero p{margin:0;opacity:.85;font-size:.88rem;font-weight:600}
.hero h1{margin:0;font-size:1.5rem}
.kur{border:0;background:rgba(255,255,255,.18);color:var(--on);border-radius:14px;padding:7px 12px;font:inherit;font-size:.85rem;font-weight:800;cursor:pointer;text-align:right;line-height:1.25;flex:none}
.kur small{display:block;font-weight:600;opacity:.85;font-size:.7rem}
.hero .etiket{margin-top:20px;opacity:.85;font-size:.88rem;font-weight:700}
.hero .buyuk{font-size:2.3rem;line-height:1.1}
.hero .usdalt{font-size:.88rem;opacity:.9;font-weight:700}
.hero .cubuk{background:rgba(255,255,255,.25);margin:14px 0 8px} .hero .cubuk i{background:#fff}
.hero .alt{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;flex-wrap:wrap;font-weight:600}
.hero .alt b{font-family:var(--f-head);font-weight:600}
.kur-form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;background:rgba(255,255,255,.15);padding:10px;border-radius:14px}
.kur-form input{flex:1 1 120px;background:rgba(255,255,255,.95);color:#1a2233;border:0}
.kur-form button{border:0;background:#fff;color:var(--accent);border-radius:10px;padding:0 16px;font:inherit;font-weight:800;cursor:pointer}
.kur-form small{flex-basis:100%;font-size:.78rem;opacity:.9}

.cubuk{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex}
.cubuk i{display:block;height:100%;background:var(--para-b);border-radius:6px}
.kart{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.bolum-baslik{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 10px}
.bolum-baslik h2{margin:0;font-size:1.05rem}
.bolum-baslik small{color:var(--muted);font-weight:700}

/* yaklaşanlar */
.yatay{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.yatay::-webkit-scrollbar{display:none}
.yak{flex:0 0 148px;scroll-snap-align:start;padding:13px;border-radius:18px;border:0;text-align:left;font:inherit;color:var(--on);background:var(--cb);cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 14px color-mix(in srgb,var(--cb) 30%,transparent)}
.yak .g{font-family:var(--f-head);font-size:1.9rem;font-weight:700;line-height:1}
.yak .gl{font-size:.76rem;font-weight:800;opacity:.9}
.yak .ad{font-weight:800;font-size:.92rem;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yak .tr{font-size:.78rem;opacity:.85;font-weight:600}

/* araç çubuğu */
.arac{display:flex;gap:8px;margin-bottom:10px}
.arama{flex:1;min-width:0;position:relative}
.arama input{padding-left:38px}
.arama svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit;font-size:16px}
select{width:auto}
textarea{resize:vertical;min-height:84px}
.cipler{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding-bottom:2px}
.cipler::-webkit-scrollbar{display:none}
.cip{flex:none;border:0;background:var(--cs,var(--card));color:var(--c,var(--ink));border-radius:999px;padding:7px 14px;font:inherit;font-size:.86rem;font-weight:800;cursor:pointer}
.cip[aria-pressed="true"]{background:var(--cb,var(--ink));color:var(--on)}
.cip:not([style]){box-shadow:inset 0 0 0 1px var(--line)}
.cip[aria-pressed="true"]:not([style]){background:var(--ink);color:var(--card);box-shadow:none}

/* iş kartı: dosya sekmesi */
.isler{display:flex;flex-direction:column;gap:12px}
.is{display:block;padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;border:0}
.is .sekme{background:var(--cb);color:var(--on);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.is .sekme .ad{font-family:var(--f-head);font-weight:600;font-size:1.02rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.is .sekme .sure{font-size:.8rem;font-weight:800;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px;white-space:nowrap}
.is .sekme .sure.gec{background:#fff;color:var(--gec-b)}
.is .govde{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:10px 14px;padding:12px 16px 14px}
.is .konu{color:var(--ink);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.is .bilgi-s{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.etk{font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:8px;background:var(--cs);color:var(--c)}
.pil{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:8px;background:var(--soft);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.pil.gec{background:var(--gec-s);color:var(--gec)} .pil.yakin{background:var(--yakin-s);color:var(--yakin)} .pil.ok{background:var(--teslim-s);color:var(--teslim)} .pil.para{background:var(--para-s);color:var(--para)} .pil.usd{background:var(--usd-s);color:var(--usd)}
.halka{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--para-b) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;align-self:start}
.halka span{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-head);font-size:.78rem;font-weight:700;color:var(--para)}
.asama-mini{display:flex;gap:3px;align-items:center;margin-left:auto}
.asama-mini i{width:11px;height:7px;border-radius:2px;background:var(--line)}
.asama-mini i.d{background:var(--accent)}
.bos{padding:36px 20px;text-align:center;color:var(--muted)}
.bos b{display:block;color:var(--ink);font-family:var(--f-head);font-size:1.05rem;margin-bottom:4px}

/* alt gezinme */
.nav button{position:relative}.nav-say{position:absolute;top:2px;left:calc(50% + 6px);background:#d6336c;color:#fff;border-radius:999px;font-size:.68rem;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-weight:800}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:4;box-shadow:0 -4px 16px rgba(20,40,80,.06)}
.nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:.72rem;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;border-radius:12px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav svg{width:22px;height:22px}
.ekle{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff;font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent);z-index:4}

/* tam ekran */
.ekran{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:6;padding-top:env(safe-area-inset-top,0px)}
.ekran-ust{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--bg)}
.ekran-ust button,.lnk{border:0;background:none;color:var(--accent);font:inherit;font-weight:800;cursor:pointer;padding:8px 6px;border-radius:8px}
.ekran-ust .ort{font-weight:800;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{max-width:640px;margin:0 auto;padding:4px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.kahraman{padding:18px;background:var(--cb);color:var(--on);border:0;box-shadow:0 8px 22px color-mix(in srgb,var(--cb) 30%,transparent)}
.k-ust{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.k-sol{min-width:0;flex:1}
.kahraman .k-sol .ad{margin:0 0 4px}
.etiketler{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;max-width:45%}
.etiketler span{font-size:.76rem;font-weight:800;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.etiketler .mk-e{background:#fde4f2;color:#a3266f}
.kahraman .tur{font-size:.78rem;font-weight:800;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px}
.kahraman .ad{font-family:var(--f-head);font-size:1.4rem;font-weight:600;margin:10px 0 4px}
.kahraman .konu{margin:0;opacity:.95;overflow-wrap:anywhere}
.geri-sayim{display:flex;align-items:baseline;gap:6px;margin-top:16px;flex-wrap:wrap}
.geri-sayim b{font-family:var(--f-head);font-size:2.6rem;line-height:1}
.geri-sayim span{font-weight:800}
.geri-sayim small{margin-left:auto;opacity:.9;font-weight:700}
.durum-sec{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.durum-sec button{border:0;background:rgba(255,255,255,.2);color:var(--on);border-radius:999px;padding:7px 12px;font:inherit;font-size:.82rem;font-weight:800;cursor:pointer}
.durum-sec button[aria-pressed="true"]{background:#fff;color:var(--cb)}
.blok{padding:16px}
.blok h3{margin:0 0 12px;font-size:1rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.blok h3 small{font-family:var(--f-body);color:var(--muted);font-weight:700;font-size:.82rem}
.bilgi{display:flex;flex-direction:column}
.bilgi div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.bilgi div:first-child{border-top:0;padding-top:0}
.bilgi span{color:var(--muted);flex:none;font-weight:600}
.bilgi b{font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.mini-btn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:6px 11px;font:inherit;font-size:.8rem;font-weight:800;cursor:pointer;text-decoration:none;white-space:nowrap}
.satir-is .ch .bk{background:#fff1cc;color:#8a5a00}
.su-durum{background:#fff;color:var(--cb);border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:800}
.durum-sec button[data-bekle][aria-pressed="true"]{background:#ffd75e;color:#5a3c00}
.kilit{opacity:.45;filter:grayscale(.6)}
.kilitli-btn{opacity:.4}
.kilit-bant{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:#fff1cc;color:#5a3c00;border:2px solid #ffd75e;border-radius:18px;padding:14px 16px;margin-top:14px}
.kilit-bant b{font-weight:800;width:100%}.kilit-bant span{flex:1;min-width:160px;font-weight:600;font-size:.92rem}
.kilit-bant button{border:0;background:#b37400;color:#fff;border-radius:12px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer}
.gb-ust{display:grid;grid-template-columns:1.35fr 1fr .7fr;gap:8px}.gb-ust div{background:var(--soft);border-radius:14px;padding:10px 12px;min-width:0}
.gb-ust span{display:block;font-size:12px;color:var(--muted);font-weight:700}.gb-ust b{display:block;font-size:18px;font-weight:800;white-space:nowrap}
.gb-ust .ana{background:#0b6e4c}.gb-ust .ana span{color:#cfeee0}.gb-ust .ana b{color:#ffd75e}
.gb{height:190px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;margin-top:10px;border-bottom:1px solid var(--line)}
.gb .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.gb .c i{width:70%;background:#0fa86f;border-radius:4px 4px 0 0}.gb .c.bu i{background:#0b6e4c}
.gb .c b{font-size:11.5px;font-weight:800;margin-bottom:4px;white-space:nowrap;letter-spacing:-.02em}.gb .c.sifir b{color:var(--muted);font-weight:600}
.gb-ay{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}.gb-ay .bu{color:#0b6e4c}
.tk-od{border:0!important;padding:0!important;margin:0;text-align:left}
.kay-s{animation:kayS .25s ease-out}.kay-g{animation:kayG .25s ease-out}
@keyframes kayS{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}@keyframes kayG{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
.ozet-kart{padding:14px 16px;margin-top:14px;display:flex;flex-direction:column;gap:2px}
.ozet-kart.tamam{flex-direction:row;align-items:center;gap:12px;background:#e9f8f0}.ozet-kart.tamam b{display:block}.ozet-kart.tamam small{color:var(--muted);font-weight:600}
.oz-ik{width:34px;height:34px;border-radius:50%;background:#0fa86f;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.oz-bas{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.oz-bas b{font-size:1.1rem;font-weight:800}.oz-bas small{color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center}
.oz-say{background:#ffe0e0;color:#b3261e;border-radius:999px;padding:2px 9px;font-weight:800}
.oz-satir{display:flex;align-items:center;gap:12px;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;width:100%}
.oz-bas+.oz-satir,.ozet-kart.detay .oz-satir:first-child{border-top:0}
.oz-satir i{width:12px;height:12px;border-radius:50%;flex:none}.oz-satir span{flex:1;min-width:0;display:flex;flex-direction:column}
.oz-satir b{font-weight:800}.oz-satir small{font-size:.9rem;font-weight:600;color:var(--muted)}.oz-satir em{font-style:normal;color:var(--muted);font-size:1.3rem}
.oz-satir.d3 i{background:#d6336c;box-shadow:0 0 0 4px #ffe0ea}.oz-satir.d2 i{background:#f08c00;box-shadow:0 0 0 4px #fff0d6}.oz-satir.d1 i{background:#e3b505;box-shadow:0 0 0 4px #fff7cc}
.oz-satir.d3 small{color:#b3261e}.ozet-kart.detay .oz-satir small{font-size:.95rem;color:var(--ink)}
.oz-tum{border:0;background:var(--soft);border-radius:12px;padding:10px;font:inherit;font-weight:800;color:var(--accent);cursor:pointer;margin-top:6px}
.satir-is .ch .uy-r{color:#fff}.satir-is .ch .uy-r.d3{background:#d6336c}.satir-is .ch .uy-r.d2{background:#f08c00}.satir-is .ch .uy-r.d1{background:#e3b505;color:#3a2c00}
.zc-s.fz[hidden]{display:none!important}
.zc-s.fz{cursor:pointer;user-select:none;display:flex!important;flex-direction:row!important;align-items:center!important;gap:12px!important;font-weight:inherit;color:inherit}
.zc-s.fz:has(input:checked) .nk{background:var(--cb);border-color:var(--cb)}
.zc-s.fz:has(input:checked) .m b{color:var(--ink)}
.zc-s.fz:has(input:checked):not(:last-child)::before{background:var(--cb)}
.zc-s.fz .m{padding-top:2px}
.cz-satir{display:flex;flex-direction:column;padding:10px 0;border-top:1px solid var(--line)}.cz-satir:first-of-type{border-top:0}.cz-satir b{font-weight:700}.cz-satir small{color:var(--muted);font-weight:600}
.cz-bu{background:#dcf5e8;color:#0b6e4c;border-radius:999px;padding:1px 8px;font-size:.75rem;font-weight:800;margin-left:4px}
.baslik-sat{display:flex;align-items:center;gap:10px}
.kilit-caps{margin:-4px 0 0;background:#fff3c4;color:#6b5000!important;border-radius:10px;padding:8px 10px;font-size:14px!important;font-weight:700}
#kilitSay.tam{color:#0b6e4c;font-weight:800}#kilitSay.fazla{color:#b3261e;font-weight:800}
.caps-dgm{border:0;background:#eef3f0;color:#4f5f57;border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.caps-dgm b{font-weight:800}.caps-dgm.acik{background:#ffd75e;color:#5a3c00}
.otp-sar{position:relative}
.otp{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.otp span{flex:1 1 0;max-width:38px;min-width:28px;height:48px;border-radius:12px;border:2px solid #dbe2ea;background:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;color:#0b6e4c;transition:all .12s}
.otp span.dolu{border-color:#0b6e4c;background:#ecf8f2}.otp span.tam{border-color:#0fa86f;background:#dcf5e8}.otp span.fazla{border-color:#d6336c;background:#ffe3ea;color:#b3261e}
.otp span.sira{border-color:#0fa86f;box-shadow:0 0 0 3px rgba(15,168,111,.22)}
.otp-sar input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;cursor:text}
.kilit-sag{display:flex;gap:6px;align-items:center}
.kilit-goz.kucuk{width:32px;height:30px;border-radius:999px}.kilit-goz.kucuk svg{width:18px;height:18px}
.otp span{height:52px;max-width:40px;font-size:24px}
.otp span.pop{animation:otpPop .18s ease-out}@keyframes otpPop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.otp-durum{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px}
.otp-durum #kilitSay{font-size:14px;font-weight:700;color:#5b6578}
.otp-cubuk{display:block;width:100%;height:4px;border-radius:999px;background:#e6ece9;overflow:hidden}
.otp-cubuk b{display:block;height:100%;width:0;background:#0b6e4c;border-radius:999px;transition:width .15s}.otp-cubuk b.tam{background:#0fa86f}.otp-cubuk b.fazla{background:#d6336c}
.otp-dgm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.otp-btn{display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid #e1e8e4;background:#f6f9f7;color:#3d4a44;border-radius:12px;padding:9px 8px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.otp-btn[aria-pressed="true"]{border-color:#0b6e4c;background:#ecf8f2;color:#0b6e4c}
#kilitCaps[aria-pressed="true"]{border-color:#e3b505;background:#fff3c4;color:#5a3c00}
.caps-ik{font-size:16px}
.otp-btn span{white-space:nowrap}.otp-btn span b{display:inline!important;font-weight:800}
#ucretYan{align-self:end;padding:0;height:48px;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.zc{display:flex;flex-direction:column;position:relative;padding-left:4px}

<script>
/* ===== sabitler ===== */
const MAKALE_ASAMA="Makale yazımına başlandı";
const ADAY="Ön görüşme";
const DURUM={[ADAY]:"gorusme","Teze başlandı":"devam","Etik kurula sunuldu":"devam","Etik onay alındı":"devam","Veri seti tamamlandı":"devam","İstatistiğe başlandı":"devam","Tez yazımına başlandı":"devam","Revizyonda":"revizyon",[MAKALE_ASAMA]:"makale","Teslim edildi":"teslim","İptal":"iptal"};
const DURUMLAR=Object.keys(DURUM);
const durumlar=i=>DURUMLAR.filter(d=>d!==ADAY&&(d!==MAKALE_ASAMA||i.makale));
const ESKI_DURUM={"Devam ediyor":"Teze başlandı","Görüşme":ADAY};
function durumAta(i,yeni){const g=[...(i.gecmis||[])];if(!g.length&&i.durum)g.push({d:i.durum,t:(i.baslangic||bugun())+"T00:00:00"});g.push({d:yeni,t:new Date().toISOString()});return{...i,durum:yeni,gecmis:g}}
/* ===== İş özeti kuralları (uygulama ve e-posta ortak) ===== */
function uyariHesapla(i,bugun,A,kalanMetin){
  const G=(a,b)=>Math.round((new Date(String(b).slice(0,10)+"T00:00:00")-new Date(String(a).slice(0,10)+"T00:00:00"))/864e5);
  const HEDEF=[["Etik kurula sunuldu",.15],["Etik onay alındı",.30],["Veri seti tamamlandı",.55],["İstatistiğe başlandı",.70],["Tez yazımına başlandı",.85]];
  const SONRA=["Revizyonda","Makale yazımına başlandı","Teslim edildi"];
  const out=[],ek=(d,m)=>out.push({d:d,m:m});
  const durum=i.durum==="Devam ediyor"?"Teze başlandı":i.durum==="Görüşme"?"Ön görüşme":i.durum;
  A=A||i.asamaT||{};
  if(durum==="İptal")return out;
  if(durum==="Ön görüşme"){const t=i.baslangic||i.olusturma||(i.gecmis&&i.gecmis[0]&&i.gecmis[0].t);const g=t?G(t,bugun):0;if(g>=7)ek(1,"Ön görüşme "+g+" gündür bekliyor · dönüş yap");return out}
  if(durum==="Teslim edildi"){if(kalanMetin)ek(2,"Teslim edildi, "+kalanMetin+" alacak kaldı");return out}
  if(i.beklemede){const g=i.bekleT?G(i.bekleT,bugun):0;if(g>=10)ek(2,g+" gündür müşteriden dönüş bekleniyor");return out}
  const kg=i.teslim?G(bugun,i.teslim):null,ileri=SONRA.some(s=>A[s]);
  if(kg!==null&&kg<0)ek(3,"Teslim "+(-kg)+" gün gecikti");
  else if(kg!==null&&kg<14&&!A["Tez yazımına başlandı"]&&!ileri)ek(3,"Teslime "+kg+" gün kaldı, tez yazımına başlanmadı");
  let geride=false;
  if(i.baslangic&&i.teslim&&!ileri){const top=G(i.baslangic,i.teslim),gec=G(i.baslangic,bugun);
    if(top>0&&gec>0){const f=gec/top;
      const eksik=HEDEF.find((h,n)=>f>=h[1]&&!A[h[0]]&&!HEDEF.slice(n+1).some(x=>A[x[0]]));
      if(eksik){geride=true;ek(f-eksik[1]>=.2?3:2,"Süre %"+Math.round(Math.min(f,1)*100)+" doldu, “"+eksik[0]+"” henüz yok")}}}
  const et=A["Etik kurula sunuldu"];
  if(et&&!A["Etik onay alındı"]&&G(et,bugun)>30)ek(2,"Etik onay "+G(et,bugun)+" gündür bekleniyor");
  else if(!geride){const t=A[durum];if(t&&durum!=="Etik kurula sunuldu"&&G(t,bugun)>21)ek(2,G(t,bugun)+" gündür “"+durum+"” aşamasında")}
  return out.sort((a,b)=>b.d-a.d);
}
function isUyari(i){return uyariHesapla(i,bugun(),asamaT(i),kalan(i)>0.5?para(kalan(i),i.pb):"")}
let ozetAcik=false;
function gOzet(tam){const l=isler.flatMap(i=>isUyari(i).map(u=>({...u,i}))).sort((a,b)=>b.d-a.d||(a.i.teslim||"9").localeCompare(b.i.teslim||"9"));
  if(!l.length)return`<section class="kart ozet-kart tamam"><span class="oz-ik">✓</span><div><b>İş özeti</b><small>Her şey yolunda, dikkat gerektiren iş yok.</small></div></section>`;
  const g=ozetAcik||tam?l:l.slice(0,4),k=l.filter(x=>x.d===3).length;

let tkKay=null;

  return sek+`<div class="osa" data-s="${b?1:0}"><div class="osp" data-i="0">${gAlinan()}</div><div class="osp" data-i="1">${gBekleyen()}</div></div>`;

/* Alınan ↔ Bekleyen: derinlikli kaydırma (B) */
const OYAY="transform .45s cubic-bezier(.22,.9,.24,1),opacity .45s";
function oParca(){const a=document.querySelector(".osa");if(!a)return null;return{a,p0:a.querySelector('[data-i="0"]'),p1:a.querySelector('[data-i="1"]'),sek:document.querySelector(".osek"),ind:document.querySelector(".osek-ind")}}
function oGecis(o,acik){const v=acik?OYAY:"none";o.p0.style.transition=o.p1.style.transition=v;o.ind.style.transition=acik?"transform .45s cubic-bezier(.22,.9,.24,1),background .3s":"none"}
function oCiz(o,p){const W=o.a.clientWidth,q=Math.max(0,Math.min(1,p));o.a.classList.add("kayiyor");
  o.p1.style.transform=`translateX(${(1-p)*(W+30)}px)`;
  o.p0.style.transform=`translateX(${-q*W*.18}px) scale(${1-q*.08})`;o.p0.style.opacity=String(1-q*.5);
  o.ind.style.transform=`translateX(calc(${p*100}% + ${p*6}px))`;o.sek.classList.toggle("bek",q>=.5);
  o.sek.querySelectorAll("button").forEach((b,k)=>b.setAttribute("aria-selected",String(k===(q>=.5?1:0))))}
function oBitir(o,s){o.a.classList.remove("kayiyor");o.a.dataset.s=s;[o.p0,o.p1].forEach(x=>{x.style.transform=x.style.opacity=x.style.transition=""});
  o.ind.style.transform=o.ind.style.transition="";const yeni=s?"bekleyen":"alinan";if(yeni!==odemeSekme){odemeSekme=yeni;navDegistir()}}
function oGit(s,o=oParca()){if(!o)return;oGecis(o,true);requestAnimationFrame(()=>{oCiz(o,s);
  let bitti=false;const son=()=>{if(bitti)return;bitti=true;oBitir(o,s)};const tb=e=>{if(e.target===o.p1){o.p1.removeEventListener("transitionend",tb);son()}};o.p1.addEventListener("transitionend",tb);setTimeout(son,520)})}
let oKay=null;
document.addEventListener("touchstart",e=>{const a=e.target.closest(".osa");if(!a||e.touches.length!==1){oKay=null;return}
  const t=e.touches[0];oKay={x:t.clientX,y:t.clientY,yon:null,s:+a.dataset.s,p:+a.dataset.s,iz:[{x:t.clientX,t:e.timeStamp}]}},{passive:true});
document.addEventListener("touchmove",e=>{if(!oKay)return;const t=e.touches[0],dx=t.clientX-oKay.x,dy=t.clientY-oKay.y;
  if(!oKay.yon){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;oKay.yon=Math.abs(dx)>Math.abs(dy)*1.2?"x":"y";if(oKay.yon==="x"){oKay.o=oParca();oGecis(oKay.o,false)}}
  if(oKay.yon!=="x")return;e.preventDefault();
  oKay.iz.push({x:t.clientX,t:e.timeStamp});if(oKay.iz.length>5)oKay.iz.shift();
  let p=oKay.s-dx/oKay.o.a.clientWidth;if(p<0)p*=.3;if(p>1)p=1+(p-1)*.3;oKay.p=p;oCiz(oKay.o,p)},{passive:false});
document.addEventListener("touchend",()=>{if(!oKay)return;const k=oKay;oKay=null;if(k.yon!=="x")return;
  const a=k.iz[0],b=k.iz[k.iz.length-1],hiz=(b.x-a.x)/Math.max(1,b.t-a.t);
  oGit(hiz<-.35?1:hiz>.35?0:(k.p>.5?1:0),k.o)});
document.addEventListener("touchcancel",()=>{if(oKay&&oKay.yon==="x")oGit(oKay.s,oKay.o);oKay=null});
function gAlinan(){

  tum.forEach(o=>{const a=aylar.find(x=>o.tarih.startsWith(x.a));if(a)a.t+=oTL(o)});
  const mx=Math.max(...aylar.map(a=>a.t),1),topTL=tum.reduce((a,o)=>a+oTL(o),0);

      <small>${tarih(o.tarih)}${o.not?" · "+esc(o.not):""}</small>${o.ekNot?`<span class="eknot">${esc(o.ekNot)}</span>`:""}</span></button>`;
  return`<section class="kart blok" style="margin-top:16px">
    <div class="gb-ust"><div class="ana"><span>Toplam tahsilat</span><b data-sayac="topTahsil" data-deger="${topTL}">${tl(topTL)}</b></div><div><span>Bu ay</span><b>${tl(aylar[5].t)}</b></div><div><span>Ödeme</span><b>${tum.length}</b></div></div>

  <section class="kart blok" style="padding-top:4px"><div class="odeme-liste" style="margin-top:0">${g.l.map(satir).join("")}</div></section>`).join("")
  :`<section class="kart blok"><p class="bos" style="padding:20px">Henüz ödeme yok.</p></section>`}`;

function gBekleyen(){

      <span class="ust"><b class="ad">${esc(i.musteri||"—")}</b><b class="tut">${para(k,i.pb)}</b></span>
      <span class="alt"><small class="kn">${esc(i.konu||"")}</small>${U?`<small class="tl">≈ ${tl(k*KUR.usd)}</small>`:""}</span>

      <span class="alt"><small>Ücret ${para(i.ucret,i.pb)} · %${p} ödendi<br>${son?`Son ödeme ${tarih(son.tarih,1)}`:"Henüz ödeme yok"}</small><small class="sure ${s.c}">${s.t}</small></span>
    </button>`};
  const n=new Date(),buAy=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`,kova=[{ad:"Gecikmiş",gec:1,t:0}];
  for(let k=0;k<4;k++){const d=new Date(n.getFullYear(),n.getMonth()+k,1);kova.push({a:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,ad:d.toLocaleDateString("tr-TR",{month:"short"}),bu:k===0,t:0})}
  kova.push({ad:"Sonra",son:1,t:0});
  l.forEach(i=>{const a=(i.teslim||"").slice(0,7),v=kalanTL(i);const x=!a?kova[5]:a<buAy?kova[0]:kova.find(k=>k.a===a)||kova[5];x.t+=v});

    <div class="gb-ust kirmizi"><div class="ana"><span>Muhtemel ödeme</span><b data-sayac="topBekleyen" data-deger="${top}">${tl(top)}</b></div><div><span>Dolar alacak</span><b>${usd(usdT)}</b></div><div><span>TL alacak</span><b>${tl(tlT)}</b></div></div>

    <div class="gb-ay kirmizi">${kova.map(k=>`<span class="${k.bu?"bu":""} ${k.gec?"gec":""}">${k.ad}</span>`).join("")}</div>
    <p class="ipucu" style="margin:10px 0 0">Kalan ödemeler işin teslim tarihine göre dağıtıldı. Muhtemel ödeme, dolar alacakların her gün güncel kurla (1 $ = ${nf(KUR.usd,2)} ₺) TL'ye çevrilmesiyle hesaplanır. "Sonra": 4 aydan sonrası ve tarihsizler.</p></section>

function gGecmis(){return`<section class="kart blok" style="margin-top:16px"><h3>Tüm işlemler <small>${loglar.length} kayıt</small></h3>${logListe(loglar,true)}</section>`}
function logListe(l,adli){
  const s=[...l].sort((a,b)=>b.zaman.localeCompare(a.zaman));
  if(!s.length)return`<p class="ipucu" style="margin:0">Henüz kayıt yok. Yaptığın her işlem buraya tarih ve saatiyle düşer.</p>`;
  let son="",h="<ul class='log'>";
  for(const x of s){const g=gunAdi(x.zaman);if(g!==son){h+=`<li class="gun">${g}</li>`;son=g}
    const r=x.tur==="not"?"var(--accent)":/Ödeme alındı/.test(x.metin)?"var(--para-b)":/Durum/.test(x.metin)?"var(--revizyon-b)":/silindi/.test(x.metin)?"var(--gec-b)":/Aşama/.test(x.metin)?"var(--gorusme-b)":/Kur/.test(x.metin)?"var(--usd)":"var(--devam-b)";
    h+=`<li><span class="nk" style="--k:${r}"></span><span class="m">${esc(x.metin)}${adli&&x.isAd?`<small>${esc(x.isAd)}</small>`:""}${x.tur==="not"?`<small><button class="lnk" style="padding:2px 0;font-size:.8rem" data-logsil="${x.id}">Notu sil</button></small>`:""}</span><time>${saat(x.zaman)}</time></li>`}
  return h+"</ul>";
}

function ekranKapa(){ekranTur=null;acikId=null;const e=$("#ekran");e.hidden=true;e.innerHTML="";document.body.style.overflow=""}

/* ===== Canlı rakamlar: değer değişince sayaç gibi akar ===== */
const SAYAC={};
function sayaclariOynat(){
  const az=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("[data-sayac]").forEach(el=>{
    const ad=el.dataset.sayac,hedef=+el.dataset.deger||0,bas=SAYAC[ad];SAYAC[ad]=hedef;
    if(az||bas===hedef)return;
    const from=bas===undefined?0:bas,t0=performance.now(),sure=bas===undefined?1100:900;
    if(bas!==undefined&&hedef>bas){el.classList.remove("sayac-artti");void el.offsetWidth;el.classList.add("sayac-artti")}
    const adim=t=>{const k=Math.min(1,(t-t0)/sure),e=1-Math.pow(1-k,3);el.textContent=tl(from+(hedef-from)*e);if(k<1&&el.isConnected)requestAnimationFrame(adim)};
    el.textContent=tl(from);requestAnimationFrame(adim)})}
/* ===== Ödeme alınınca kutlama ===== */

    p+=`<i class="para" style="left:${sol}%;animation-duration:${sure}s;animation-delay:${gec}s;--r:${r}">${Math.random()<.5?"₺":"$"}</i>`}
  k.innerHTML=p+`<div class="pano"><small>TAHSİL EDİLDİ</small><b>+${tutar}</b><span>${altYazi||""}</span></div>`;
  document.body.appendChild(k);setTimeout(()=>k.remove(),3200);
  try{navigator.vibrate&&navigator.vibrate([40,60,40])}catch(_){}}

async function kurTazeleGerekirse(){if(document.visibilityState!=="visible"||!sifreAl())return;if(KUR.zaman&&Date.now()-new Date(KUR.zaman)<300000)return;try{const b=await sr("canliKur");if(b&&b.usd&&!(KUR.kaynak==="Elle girildi"&&KUR.tarih===bugun())){KUR={usd:b.usd,tarih:bugun(),kaynak:b.kaynak,zaman:new Date().toISOString()};try{localStorage.setItem("tez-defteri-kur",JSON.stringify(KUR))}catch(_){}if(ekranTur!=="form"&&!kullaniciYaziyor())ciz()}}catch(_){}}
document.addEventListener("visibilitychange",()=>setTimeout(kurTazeleGerekirse,1500));setTimeout(kurTazeleGerekirse,3000);
setInterval(async()=>{if(document.visibilityState!=="visible"||!sifreAl())return;try{const b=await sr("canliKur");if(b&&b.usd&&!(KUR.kaynak==="Elle girildi"&&KUR.tarih===bugun())){KUR={usd:b.usd,tarih:bugun(),kaynak:b.kaynak,zaman:new Date().toISOString()};if(ekranTur!=="form"&&!kullaniciYaziyor())ciz()}}catch(_){}},300000);
let SON_SURUM=null,kontrolde=false;
async function degisiklikVarMi(){
  if(kontrolde||document.visibilityState!=="visible"||ekranTur==="form"||bekleyen>0||(API&&!sifreAl())||!sifreAl())return;
  kontrolde=true;
  try{const v=await sr("surum");if((SON_SURUM!==null&&v!==SON_SURUM)||ertelenen)await yenile();else if(SON_SURUM===null)SON_SURUM=v}catch(_){}
  finally{kontrolde=false}}
setInterval(degisiklikVarMi,5000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ekranTur!=="form")yenile()});
</script>
